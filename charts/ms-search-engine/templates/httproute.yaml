apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.app.appMsSearchServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.app.appMsSearchServer.name }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayApi.gatewayName }}
    namespace: {{ .Values.gatewayApi.gatewayNamespace }}
  hostnames:
  - "{{ .Values.gatewayApi.hostname }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Values.app.appMsSearchServer.name }}
      port: {{ .Values.service.port }}
