apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.appMsSearchServer.name }}
  labels:
    app: {{ .Values.app.appMsSearchServer.name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: {{ .Values.app.appMsSearchServer.name }}
